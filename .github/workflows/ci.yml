name: CI

# Fork pipeline: lint/typecheck/test -> build + Trivy scan -> push to GHCR tagged with the SHA
# -> deploy to the marcos-snapshare namespace.
# Removed from upstream: the Vercel deploy and preview jobs and release-please. They need
# VERCEL_* / RELEASE_PLEASE_TOKEN secrets this fork doesn't have and would fail on every push;
# production here is the Kubernetes cluster, not Vercel.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run that might be deploying; PR runs can be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/snapshare
  NAMESPACE: marcos-snapshare

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Next generates route types into .next/types; tsc fails on a clean checkout without them.
      - run: npx next typegen
      - run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  image:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image with Trivy
        # Pinned by commit SHA (tags 0.0.1-0.34.2 were compromised in March 2026); v0.36.0.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"

  deploy:
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_SNAPSHARE_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Pin image to this commit
        run: |
          printf 'images:\n  - name: snapshare\n    newName: %s\n    newTag: %s\n' "$IMAGE" "$GITHUB_SHA" >> deploy/kustomization.yaml
      - name: Roll out
        run: |
          kubectl apply -k deploy
          kubectl -n "$NAMESPACE" rollout status deployment/snapshare --timeout=300s
      - name: Smoke test
        run: curl -fsS --retry 10 --retry-delay 5 --retry-all-errors http://snapshare.178.105.120.178.sslip.io/api/health
